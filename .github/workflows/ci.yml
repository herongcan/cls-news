name: ci

# PR 与 main 的守卫。只管两件事：
#
#   1. 代码还能不能编译（前端双端构建、后端 fat jar）。
#   2. 鉴权有没有被写漏。
#
# 第 2 点不是凑数：2026-11-22 上线 Vue 产物后页面白屏，原因是 BasicAuthFilter 只放行了
# /index.html，浏览器加载 <script src="/assets/..."> 时不带 Authorization 头，全部 401。
# 旧页面把 CSS/JS 内联在 HTML 里，这个洞潜伏了很久。下面那组断言就是防止它再回来。
#
# 不跑测试：仓库里没有能挡住问题的用例，让门禁卡在形式上的绿灯只会让人习惯性忽略红灯。
# 真正能挡的是「起真进程 + 打真接口」这几条，所以冒烟用 java -jar 起真实例。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 与 deploy.yml 相反：PR 上新的 push 要顶掉旧运行，没人关心被覆盖 commit 的结果。
# deploy 不能取消，中途 kill 会留下「代码已更新、容器还是旧的」中间态。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (type-check + build h5/mp)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 用 ci 而不是 install：lockfile 与 package.json 不一致时立刻失败。
      # 三个 @dcloudio 包钉在同一个 alpha 版本号上，版本错开会报内部 API 不匹配，
      # 那种错误信息看不出是依赖问题，所以宁可在安装阶段就炸。
      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        working-directory: web
        run: npm run type-check

      - name: 构建 H5
        working-directory: web
        run: npm run build:h5

      - name: 构建微信小程序
        working-directory: web
        run: npm run build:mp

      # 体积和文件数都要看：构建成功但产物缺页，是可发生的（pages.json 漏配一类）。
      - name: 校验产物
        working-directory: web
        run: |
          set -e
          H5=dist/build/h5
          MP=dist/build/mp-weixin

          for f in "$H5/index.html" "$MP/app.json" "$MP/pages/index/index.wxml"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少构建产物 $f"
              exit 1
            fi
          done

          if ! ls "$H5"/assets/*.js >/dev/null 2>&1; then
            echo "::error::$H5/assets 下没有 js，H5 产物异常"
            exit 1
          fi

          echo "H5  $(du -sh "$H5" | cut -f1)  $(find "$H5" -type f | wc -l) 个文件"
          echo "MP  $(du -sh "$MP" | cut -f1)  $(find "$MP" -type f | wc -l) 个文件"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web/dist/build/h5
            web/dist/build/mp-weixin
          retention-days: 7

  backend:
    name: backend (package + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 缓存 Maven Wrapper 下载的 Maven 本体
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: mvnw-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: mvnw-${{ runner.os }}-

      # 单元测试与打包一起跑。`mvn package` 默认就会执行 test 阶段，
      # 所以这一条既是老行为（出 jar）又是新门禁（47 个回归用例）——
      # 千万别再顺手加上 -DskipTests：跳过之后这个 job 依然是绿的，
      # 而状态机、游标、配额这些最危险的回归一条都拦不住。
      - name: 单元测试 + 打包
        run: ./mvnw -B package

      - name: 校验是 Spring Boot fat jar
        run: |
          JAR=target/cls-news-0.1.0.jar
          [ -f "$JAR" ] || { echo "::error::打包后找不到 $JAR"; exit 1; }
          ls -lh "$JAR"
          # 不是 fat jar 时服务器上会报 no main manifest attribute，
          # 得往上翻日志才看得出来，不如在这里直接拦住。
          unzip -l "$JAR" | grep -q 'BOOT-INF/' || {
            echo "::error::$JAR 不是 fat jar，检查 spring-boot-maven-plugin"; exit 1; }

      - name: 启动实例并断言鉴权行为
        run: |
          set -u
          JAR=target/cls-news-0.1.0.jar
          DB="$RUNNER_TEMP/smoke.db"
          LOG="$RUNNER_TEMP/backend.log"
          BASE=http://127.0.0.1:18080

          # 用独立端口与独立库：不碰仓库里的 data/，也不和任何既有服务抢 8080。
          APP_USER=admin APP_PASSWORD=admin \
          APP_GUEST='guest:guest' APP_GUEST_DAILY_CAP=10 \
          DB_PATH="$DB" \
          java -jar "$JAR" --server.port=18080 > "$LOG" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null --max-time 2 "$BASE/healthz"; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::后端 90 秒内没有就绪"
            tail -80 "$LOG"
            exit 1
          fi
          echo "后端已就绪"

          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 8 "$@"; }
          fail=0

          # assert <期望码> <说明> <curl 参数...>
          assert() {
            local want="$1" desc="$2"; shift 2
            local got; got=$(code "$@")
            printf '%-46s 期望 %s  实际 %s\n' "$desc" "$want" "$got"
            [ "$got" = "$want" ] || fail=1
          }
          # 只要求不是 200：这类请求的具体拒绝码取决于容器对路径的规范化时机
          assert_blocked() {
            local desc="$1"; shift
            local got; got=$(code "$@")
            printf '%-46s 期望 非200  实际 %s\n' "$desc" "$got"
            [ "$got" != "200" ] || fail=1
          }

          echo "--- 入口与静态资源 ---"
          assert 200 '首页'                          "$BASE/"
          assert 200 'legacy.html 回滚入口'           "$BASE/legacy.html"

          # 从真实产物里取一个资源名，而不是写死哈希。
          # 写死的好处是稳定，坏处是每次构建都会让它失效，最后只能被注释掉。
          ASSET=$(cd target/classes/static && ls assets/*.js 2>/dev/null | head -1)
          if [ -n "${ASSET:-}" ]; then
            # 必须写成 ${ASSET}：紧跟全角括号时 $ASSET 的变量名边界依赖 locale，
            # 在 C locale 下 bash 按字节判断，会把全角字符的首字节吞进变量名。
            assert 200 "构建资源 /${ASSET}（不带凭证）"   "$BASE/$ASSET"
          else
            echo "::warning::target/classes/static/assets 下没有 js，跳过静态资源断言"
          fi

          echo "--- 不许弹浏览器原生登录框 ---"
          # Chrome 打开任何页面都会自动请求 /favicon.ico。它一旦回 401 + WWW-Authenticate，
          # 浏览器就判定「整站要 HTTP 认证」，在页面之上盖一层原生框，页面自己的登录层
          # 被埋在下面，输对了也关不掉。所以断言的是「不带 challenge」，不是「返回 200」。
          FAVICO=$(curl -s -o /dev/null -D- "$BASE/favicon.ico" | tr -d '\r')
          if printf '%s' "$FAVICO" | grep -qi '^WWW-Authenticate:'; then
            echo "::error::/favicon.ico 带了 WWW-Authenticate，浏览器会弹原生登录框"; fail=1
          fi
          FAVICO_CODE=$(printf '%s' "$FAVICO" | head -1 | awk '{print $2}')
          if [ "$FAVICO_CODE" = "401" ]; then
            echo "::error::/favicon.ico 返回 401（期望 404）"; fail=1
          fi
          echo "favicon 状态=${FAVICO_CODE}，无 challenge"

          # 上面那条的通用版：任何 401 都不许带 challenge，否则换个路径又会把框带回来
          NO_CHALLENGE=$(curl -s -o /dev/null -D- "$BASE/api/status" | tr -d '\r')
          if printf '%s' "$NO_CHALLENGE" | grep -qi '^WWW-Authenticate:'; then
            echo "::error::401 响应里出现了 WWW-Authenticate"; fail=1
          fi

          echo "--- Basic 只剩换发入口 ---"
          assert 401 '无凭证 /api/status'              "$BASE/api/status"
          # 密码正确也不行。Basic 能直连业务接口时，登出/旋转/过期这些作废手段全都绕得过去，
          # 等于令牌体系白做；所以这里断言的是「密码对了也 401」。
          assert 401 'Basic 直连 /api/status'          -u 'admin:admin' "$BASE/api/status"
          assert 401 'Basic 直连 /api/news'            -u 'admin:admin' "$BASE/api/news"

          echo "--- 令牌访问 ---"
          A0=$(curl -s -X POST -u 'admin:admin' "$BASE/api/auth/token" | jq -r '.accessToken')
          G0=$(curl -s -X POST -u 'guest:guest' "$BASE/api/auth/token" | jq -r '.accessToken')
          assert 200 'admin /api/status'               -H "Authorization: Bearer $A0" "$BASE/api/status"
          assert 200 'guest /api/status'               -H "Authorization: Bearer $G0" "$BASE/api/status"
          assert 403 'guest /api/visits'               -H "Authorization: Bearer $G0" "$BASE/api/visits"

          echo "--- 不许借静态前缀绕过 ---"
          assert_blocked '/assets/../api/status'              --path-as-is "$BASE/assets/../api/status"
          assert_blocked '/assets/%2e%2e/api/status'          --path-as-is "$BASE/assets/%2e%2e/api/status"
          assert_blocked '/assets/..%2fapi/status'            --path-as-is "$BASE/assets/..%2fapi/status"
          assert_blocked '/healthz/../api/status'             --path-as-is "$BASE/healthz/../api/status"

          echo "--- 令牌换发（Basic 只用于这一步）---"
          TOK=$(curl -s -X POST -u 'admin:admin' "$BASE/api/auth/token")
          A1=$(echo "$TOK" | jq -r '.accessToken')
          R1=$(echo "$TOK" | jq -r '.refreshToken')
          if [ -z "${A1:-}" ] || [ "$A1" = "null" ]; then
            echo "::error::换令牌失败：$TOK"; fail=1
          fi
          assert 200 'Bearer 访问 /api/status'          -H "Authorization: Bearer $A1" "$BASE/api/status"
          assert 401 '伪造 Bearer'                       -H 'Authorization: Bearer 乱写的' "$BASE/api/status"
          assert 401 '错误密码换令牌'                    -X POST -u 'admin:错的' "$BASE/api/auth/token"
          # 不带凭证时过滤器先拦（只对 POST 放行这三个端点），所以是 401；
          # 带 Basic 也还是 401 —— Basic 分支已经删掉，过滤器不再认它，
          # 所以这里不会走到 Spring 映射层，也就拿不到 405。
          assert 401 'GET /api/auth/token（无凭证）'     "$BASE/api/auth/token"
          assert 401 'GET /api/auth/token（带 Basic）'   -u 'admin:admin' "$BASE/api/auth/token"

          echo "--- 刷新旋转 ---"
          TOK2=$(curl -s -X POST -H 'Content-Type: application/json' \
                 -d "{\"refreshToken\":\"$R1\"}" "$BASE/api/auth/refresh")
          A2=$(echo "$TOK2" | jq -r '.accessToken')
          R2=$(echo "$TOK2" | jq -r '.refreshToken')
          if [ -z "${A2:-}" ] || [ "$A2" = "null" ]; then
            echo "::error::刷新令牌失败：$TOK2"; fail=1
          fi
          assert 200 '刷新后的新 access 可用'            -H "Authorization: Bearer $A2" "$BASE/api/status"
          # 旧 refresh 旋转后不是立刻死，而是留 30 秒宽限（多标签同时刷新时不能互踢）。
          # 所以这里期望 200 而不是 401；「窗口有界」由 TokenStoreTest 覆盖 ——
          # 冒烟测试等不了 30 秒，写在这只会变成一条永远要 sleep 的断言。
          assert 200 '旧 refresh 宽限内仍可换'           -X POST -H 'Content-Type: application/json' \
                 -d "{\"refreshToken\":\"$R1\"}" "$BASE/api/auth/refresh"

          echo "--- 登出必须真的登出 ---"
          # 这条是回归来的：最初只删 refresh，access 还能再用满一个 TTL，
          # 表现是「点了退出，但复制出来的 curl 还能通」。
          assert 200 '登出'                              -X POST -H 'Content-Type: application/json' \
                 -d "{\"refreshToken\":\"$R2\"}" "$BASE/api/auth/logout"
          assert 401 '登出后 access 立刻失效'            -H "Authorization: Bearer $A2" "$BASE/api/status"
          assert 401 '登出后 refresh 立刻失效'           -X POST -H 'Content-Type: application/json' \
                 -d "{\"refreshToken\":\"$R2\"}" "$BASE/api/auth/refresh"
          # 按 session 作废，不是按账号：另开一次登录不能被牵连
          TOK3=$(curl -s -X POST -u 'admin:admin' "$BASE/api/auth/token")
          A3=$(echo "$TOK3" | jq -r '.accessToken')
          assert 200 '另一次登录不受登出影响'            -H "Authorization: Bearer $A3" "$BASE/api/status"

          echo "--- 角色能力差异 ---"
          role=$(curl -s -H "Authorization: Bearer $A0" "$BASE/api/status" | jq -r '.role')
          [ "$role" = "rw" ] || { echo "::error::admin 的角色是 $role，期望 rw"; fail=1; }
          guest_has_visit=$(curl -s -H "Authorization: Bearer $G0" "$BASE/api/status" | jq -r 'has("visitToday")')
          [ "$guest_has_visit" = "false" ] || {
            echo "::error::guest 的 /api/status 不应下发 visitToday"; fail=1; }
          echo "admin role=$role, guest 下发访客数=$guest_has_visit"

          echo "--- 重启后会话仍在 ---"
          # 这条是回归来的：原来令牌存在内存里，服务一重启全员掉线。而重启不是罕见路径 ——
          # 改配置、部署、容器滚动更新都算，用户侧看到的是「刷着刷着突然要重新登录」。
          T4=$(curl -s -X POST -u 'admin:admin' "$BASE/api/auth/token")
          A4=$(echo "$T4" | jq -r '.accessToken')
          R4=$(echo "$T4" | jq -r '.refreshToken')

          kill "$PID" 2>/dev/null || true
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null --max-time 1 "$BASE/healthz" 2>/dev/null || break
            sleep 0.5
          done
          wait "$PID" 2>/dev/null || true

          APP_USER=admin APP_PASSWORD=admin \
          APP_GUEST='guest:guest' APP_GUEST_DAILY_CAP=10 \
          DB_PATH="$DB" \
          java -jar "$JAR" --server.port=18080 >> "$LOG" 2>&1 &
          PID=$!
          ready=0
          for _ in $(seq 1 45); do
            if curl -fsS -o /dev/null --max-time 2 "$BASE/healthz"; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "::error::重启后 90 秒内没有就绪"; tail -80 "$LOG"; exit 1
          fi

          assert 200 '重启后旧 access 仍有效'            -H "Authorization: Bearer $A4" "$BASE/api/status"
          assert 200 '重启后旧 refresh 仍可换'           -X POST -H 'Content-Type: application/json' \
                 -d "{\"refreshToken\":\"$R4\"}" "$BASE/api/auth/refresh"

          echo "--- 换令牌限流 ---"
          # 这一段必须放在最后：它会把 127.0.0.1 上的 admin 锁定 15 分钟，
          # 后面再有任何「用密码换令牌」的断言都会先撞 429。
          # 默认阈值 5 次：第 5 次仍然回 401（锁定是在这次失败之后才写进去的），第 6 次才是 429。
          for i in 1 2 3 4 5; do
            assert 401 "错误密码第 $i 次"               -X POST -u 'admin:错的' "$BASE/api/auth/token"
          done
          LOCK_HDR=$(curl -s -D- -o /dev/null -X POST -u 'admin:错的' "$BASE/api/auth/token" | tr -d '\r')
          LOCK_CODE=$(printf '%s' "$LOCK_HDR" | head -1 | awk '{print $2}')
          RETRY=$(printf '%s' "$LOCK_HDR" | grep -i '^Retry-After:' | awk '{print $2}')
          [ "$LOCK_CODE" = "429" ] || { echo "::error::第 6 次错误密码应回 429，实际 $LOCK_CODE"; fail=1; }
          [ -n "$RETRY" ] || { echo "::error::429 没有 Retry-After，客户端无从知道该等多久"; fail=1; }
          # 锁定期间正确密码也必须被拒 —— 否则「锁」只是让攻击者换个密码继续试
          assert 429 '锁定期间正确密码也 429'            -X POST -u 'admin:admin' "$BASE/api/auth/token"
          echo "锁定生效，Retry-After=${RETRY}s"

          if [ "$fail" != 0 ]; then
            echo "::error::有断言未通过"
            echo "--- 后端日志尾部 ---"
            tail -60 "$LOG"
            exit 1
          fi
          echo "全部断言通过"

      - name: 失败时上传后端日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: ${{ runner.temp }}/backend.log
          retention-days: 7
          if-no-files-found: ignore
